[package]
name = "easydb"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rustyline = "17"
thiserror = "2"
lalrpop-util = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "easydb_server"
path = "src/bin/easydb_server.rs"

[[bin]]
name = "easydb_client"
path = "src/bin/easydb_client.rs"

[build-dependencies]
lalrpop = "0.22"

[dev-dependencies]
tempfile = "3"
